<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Thea Agro – Tea Auction</title>
<style>
:root{--line:#b7b7b7;--head:#e7e6e6;--goodbg:#c6efce;--good:#006100;--neubg:#ffeb9c;--neu:#7a4a00;--badbg:#ffc7ce;--bad:#9c0006;--blue:#1f4e79;--grey:#f2f2f2}
*{box-sizing:border-box}
body{font-family:Calibri,"Segoe UI",Arial,sans-serif;font-size:17px;margin:0;background:#fff;color:#111}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.wrap{max-width:1150px;margin:0 auto;padding:10px 12px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:3px solid var(--blue);padding-bottom:8px;margin-bottom:8px}
.co{font-size:24px;font-weight:700;color:var(--blue)}
.sub{color:#444;font-size:15px}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid #888;background:var(--grey);padding:8px 14px;border-radius:4px;color:#111}
.btn:hover{background:#e4e4e4}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.go{background:#1e7b34;border-color:#1e7b34;color:#fff;font-weight:700}
.btn.warn{background:#c55a11;border-color:#c55a11;color:#fff;font-weight:700}
.btn.red{background:#b3261e;border-color:#b3261e;color:#fff}
.btn.big{padding:14px 22px;font-size:20px}
.btn.sm{padding:3px 8px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.login{max-width:430px;margin:40px auto;text-align:center}
.login input{width:100%;font-size:34px;text-align:center;letter-spacing:6px;padding:12px;border:2px solid var(--blue);border-radius:6px;margin:14px 0}
.msg{padding:10px 12px;border:1px solid var(--line);background:var(--grey);margin:10px 0}
.msg.bad{background:var(--badbg);color:var(--bad);border-color:var(--bad)}
.msg.good{background:var(--goodbg);color:var(--good);border-color:var(--good)}
.msg.neu{background:var(--neubg);color:var(--neu);border-color:#c9a400}
.demo{background:#fff2cc;border:2px dashed #c9a400;padding:8px 10px;margin-bottom:8px;font-size:15px}
.bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin:8px 0}
.count{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.bchips{position:sticky;top:0;z-index:6;background:#fff;margin:0 !important;padding:6px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:2px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-weight:600}
.chip.on{border-color:var(--blue);background:#dde9f5}
.chip.g{color:var(--good)}.chip.o{color:var(--neu)}
table.sheet{border-collapse:collapse;width:100%}
.sheet th,.sheet td{border:1px solid var(--line);padding:7px 9px;vertical-align:middle}
.sheet th{background:var(--head);text-align:left;font-weight:700;white-space:nowrap}
.sheet td.n,.sheet th.n{text-align:right;font-variant-numeric:tabular-nums}
.sheet tr.lead td{background:var(--goodbg);color:var(--good)}
.sheet tr.behind td{background:var(--neubg);color:var(--neu)}
.sheet tr.sold td,.sheet tr.na td{background:#e9e9e9;color:#666}
.sheet tr.changed td{animation:flash 1.6s}
@keyframes flash{0%{outline:3px solid #f4b400;outline-offset:-3px}100%{outline:3px solid transparent}}
.hi{font-size:20px;font-weight:700}
.small{font-size:14px;font-weight:400}
.status{font-weight:700}
.lotc{font-weight:700;white-space:nowrap}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.note{background:#f7f7f7;border-left:4px solid var(--blue);padding:8px 10px;margin:8px 0}
.foot{color:#555;font-size:15px;margin-top:12px}
/* modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.on{display:flex}
.sheetbox{background:#fff;width:100%;max-width:520px;border-radius:12px 12px 0 0;padding:16px;max-height:96vh;overflow:auto}
@media(min-width:700px){#modal{align-items:center}.sheetbox{border-radius:12px}}
.sheetbox h3{margin:0 0 6px}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #ddd;font-size:18px}
.stepper{display:flex;gap:8px;align-items:stretch;margin:12px 0 6px}
.stepper input{flex:1;min-width:0;font-size:32px;text-align:center;border:2px solid var(--blue);border-radius:6px;padding:6px}
.stepper button{width:64px;font-size:34px;font-weight:700;border:2px solid var(--blue);background:#dde9f5;border-radius:6px}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.quick button{flex:1;min-width:70px;padding:8px 4px;border:1px solid #888;background:var(--grey);border-radius:4px;font-size:17px}
.mb{display:flex;gap:8px;margin-top:12px}
.mb .btn{flex:1}
#toasts{position:fixed;left:0;right:0;top:8px;z-index:30;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{pointer-events:auto;max-width:560px;width:calc(100% - 20px);padding:12px 14px;border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.3);font-weight:600}
.toast.good{background:var(--goodbg);color:var(--good);border:1px solid var(--good)}
.toast.bad{background:var(--badbg);color:var(--bad);border:1px solid var(--bad)}
.toast.neu{background:var(--neubg);color:var(--neu);border:1px solid #c9a400}
/* admin */
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--blue);margin:4px 0 6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);border-bottom:0;background:var(--grey);padding:5px 12px;border-radius:5px 5px 0 0;font-weight:600}
.tab.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.scroll{overflow:auto;max-width:100%;max-height:70vh;border:1px solid var(--line)}
.stickybar{margin:0}
.stickybar .top{flex-wrap:wrap}
.stickybar .bar{margin:2px 0 4px}
.ttl{min-width:0}
.ttl .sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.buyer th{position:sticky;top:var(--chipsh,0px);z-index:5;box-shadow:0 2px 0 var(--line)}
.stickybar .btn{padding:6px 12px;font-size:16px}
.stickybar .btn.big{font-size:16px}
.stickybar .tools{flex-wrap:nowrap;flex-shrink:0}
.adm td,.adm th{font-size:15px;padding:4px 6px}
.adm input[type=text],.adm input[type=number],.adm select{width:100%;border:1px solid #ccc;padding:5px;font-size:15px;background:#fff}
.adm td.cell{padding:0;min-width:84px}
.adm td.cell input{border:0;text-align:right;background:transparent;padding:8px 6px;font-size:16px}
.adm tr.newrow td{background:#eaf3fb}
.adm td.cell.win{background:var(--goodbg)}
.adm td.cell.win input{font-weight:700;color:var(--good)}
.adm th{position:sticky;top:0;z-index:3;box-shadow:0 1px 0 var(--line),0 -1px 0 var(--line)}
.adm .stick{position:sticky;left:0;background:#fff;z-index:2}
.adm th.stick{background:var(--head);z-index:4}
.adm .stick2{position:sticky;left:var(--lotw,80px);background:#fff;z-index:2;box-shadow:2px 0 0 var(--line)}
.adm th.stick2{background:var(--head);z-index:4}
.adm tr.soldrow td{background:#eee}
.hf{overflow-x:auto;margin:8px 0}.hf table{border-collapse:collapse;background:#fff}.hf th{position:static !important;vertical-align:bottom}.hf td{padding:4px;border:1px solid var(--line)}.hf input,.hf select{min-width:130px}.hf .hint{font-weight:400}
.chg{background:#fff3c4 !important;outline:2px solid #e0a800}
tr.draft td{background:#e8f3ff}
#cfm{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:99;padding:16px}#cfm.on{display:flex}#cfm .box{background:#fff;border-radius:8px;max-width:460px;width:100%;padding:18px;border-top:8px solid var(--bad,#c0392b)}#cfm h3{margin:0 0 8px}#cfm .mb{display:flex;gap:8px;margin-top:14px}#cfm .mb .btn{flex:1}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin:10px 0}
.form label{display:block;font-weight:600;font-size:15px;margin-bottom:3px}
.form input,.form select,.form textarea{width:100%;padding:8px;border:1px solid #999;border-radius:3px;font-size:16px}
h2{font-size:20px;margin:16px 0 6px;color:var(--blue)}
.pill{display:inline-block;padding:3px 10px;border-radius:12px;font-weight:700;font-size:15px}
.pill.on{background:var(--goodbg);color:var(--good)}.pill.off{background:var(--badbg);color:var(--bad)}.pill.sch{background:var(--neubg);color:var(--neu)}
.hint{color:#555;font-size:14px}
/* phones: same table, just tighter */
@media(max-width:760px){
 body{font-size:16px}
 .co{font-size:20px}
 .sheet th,.sheet td{padding:6px 5px}
 table.buyer th{font-size:13px;white-space:normal;line-height:1.15;vertical-align:bottom}
 table.buyer td.act{width:34%}
 table.buyer .btn{padding:9px 6px;font-size:16px;width:100%}
 table.buyer .btn.sm{padding:6px;font-size:14px}
 table.buyer .acts{flex-direction:column;align-items:stretch;gap:4px}
 table.buyer .hi{font-size:18px}
 .status.small{font-size:13px}
}
</style>
</head>

  var SCHEMA = {
    Settings: ['key', 'value'],
    Sales: ['id', 'company', 'saleNo', 'date', 'place', 'mode', 'start', 'end', 'increment', 'extendMin', 'note', 'created'],

  };

  /* ---------- small helpers ---------- */
  function fail(code, extra) { var e = new Error(code); e.code = code; e.extra = extra || null; return e; }
  function errRes(e) { return { ok: false, error: e.code, extra: e.extra || null }; }
  function round2(n) { return Math.round(n * 100) / 100; }
  function num(v) { var n = Number(String(v == null ? '' : v).replace(/,/g, '')); return isFinite(n) ? n : 0; }
  function norm(c) { return String(c == null ? '' : c).replace(/\D/g, ''); }
  function uid(store, p) { return p + Math.floor(store.rand() * 1e9).toString(36) + store.now().toString(36).slice(-4); }
  function clean(v, max) { return String(v == null ? '' : v).replace(/[\u0000-\u001f]/g, ' ').trim().slice(0, max || 100); }
  function find(arr, fn) { for (var i = 0; i < arr.length; i++) if (fn(arr[i])) return arr[i]; return null; }

  function getSet(store, k) {
    var r = store.read('Settings');
    for (var i = 0; i < r.length; i++) if (r[i].key === k) return r[i].value;
    return null;
  }
  function setSet(store, k, v) {
    var r = store.read('Settings'), done = false;
    for (var i = 0; i < r.length; i++) if (r[i].key === k) { r[i].value = v; done = true; }
    if (!done) r.push({ key: k, value: v });
    store.write('Settings', r);
  }
  function log(store, who, action, detail) {
    store.append('Log', { ts: store.now(), who: who, action: action, detail: detail || '' });
  }
  function commit(store, who, action, detail) { log(store, who, action, detail); store.bump(); }

  /* ---------- first-time setup ---------- */
  function init(store, opts) {
    opts = opts || {};
    if (store.read('Settings').length) return;
    var now = store.now();
    var admin = opts.adminCode || String(10000000 + Math.floor(store.rand() * 89999999));
    var sales = [], lots = [];
    if (!opts.demo) {
      sales.push({ id: 'S1', company: SEED.company, saleNo: '', date: '', place: SEED.place, mode: 'closed', start: 0, end: 0, increment: 3, extendMin: 2, note: '', created: now });
    }
    (opts.demo ? SEED.sales : []).forEach(function (s, i) {
      var id = 'S' + (i + 1);
      sales.push({ id: id, company: SEED.company, saleNo: s.saleNo, date: s.date, place: SEED.place, mode: 'closed', start: 0, end: 0, increment: 3, extendMin: 2, note: '', created: now });
      s.lots.forEach(function (l, j) {
        lots.push({ id: id + 'L' + (j + 1), saleId: id, lotNo: l[0], grade: l[1], bags: l[2], perBag: l[3], startPrice: 0, remarks: l[4] || '', status: 'open', soldTo: '', soldPrice: 0, sort: j + 1, targetPrice: 0 });
      });
    });
    store.write('Sales', sales);
    store.write('Lots', lots);
    store.write('Buyers', []);
    store.write('Bids', []);
    store.write('Settings', [
      { key: 'adminCode', value: admin },
      { key: 'activeSale', value: sales[sales.length - 1].id },
      { key: 'companies', value: JSON.stringify(['Krishnakali Tea Estate', 'Khagrabari Tea', 'Dighli Tea Estate']) }
    ]);
    store.bump();
  }

  /* demo only: a few buyers and bids so the page can be tried at once */
  function seedDemo(store) {
    init(store, { adminCode: '99999999', demo: true });
    if (store.read('Buyers').length) return;
    var sid = getSet(store, 'activeSale'), now = store.now();
    var names = ['Demo Buyer 1', 'Demo Buyer 2', 'Demo Buyer 3'], codes = ['111111', '222222', '333333'];
    store.write('Buyers', names.map(function (n, i) { return { id: 'B' + (i + 1), saleId: sid, code: codes[i], name: n, created: now }; }));
    var lots = store.read('Lots').filter(function (l) { return l.saleId === sid; });
    var bids = [];
    lots.slice(0, 8).forEach(function (l, i) {
      var base = 300 + (i % 4) * 15;
      bids.push({ saleId: sid, lotId: l.id, buyerId: 'B2', amount: base + 3, ts: now - 60000 });
      if (i % 2 === 0) bids.push({ saleId: sid, lotId: l.id, buyerId: 'B3', amount: base + 1, ts: now - 30000 });
      if (i === 1 || i === 4) bids.push({ saleId: sid, lotId: l.id, buyerId: 'B1', amount: base + 5, ts: now - 10000 });
    });
    store.write('Bids', bids);
    var sales = store.read('Sales');
    sales.forEach(function (s) { if (s.id === sid) { s.mode = 'open'; } });
    store.write('Sales', sales);
    store.bump();
  }

  /* ---------- rules ---------- */
  function isOpen(s, now) {
    if (s.mode === 'open') return true;
    if (s.mode === 'scheduled') return s.start > 0 && now >= s.start && (s.end <= 0 || now < s.end);
    return false;
  }
  function throttle(store) { var n = store.failCount(); store.sleep(n > 30 ? 8000 : 1200); }

  function auth(store, code) {
    code = norm(code);
    var res = null;
    if (code) {
      if (code === String(getSet(store, 'adminCode'))) res = { role: 'admin', name: 'Admin' };
      else {
        var mine = store.read('Buyers').filter(function (x) { return x.code === code; }), actv = getSet(store, 'activeSale');
        var b = find(mine, function (x) { return x.saleId === actv; }) || mine[0];
        if (b) {
          if (b.saleId === getSet(store, 'activeSale')) res = { role: 'buyer', buyer: b, name: b.name };
          else { throttle(store); throw fail('old_code'); }
        }
      }
    }
    if (!res) { throttle(store); throw fail('bad_code'); }
    return res;
  }

  function activeSale(store) {
    var id = getSet(store, 'activeSale');
    var s = find(store.read('Sales'), function (x) { return x.id === id; });
    if (!s) throw fail('no_sale');
    return s;

  function stats(list) {
    var best = null, n = 0;
    list.forEach(function (b) {
      if (b.amount > 0) {
        n++;

  }
  function groupBids(bids, saleId) {

    return m;
  }
  function saleView(s, now) {
    return { id: s.id, company: s.company, saleNo: s.saleNo, date: s.date, place: s.place, mode: s.mode, start: s.start, end: s.end, increment: s.increment || 3, extendMin: s.extendMin, note: s.note, open: isOpen(s, now) };
  }

  /* ---------- what a buyer is allowed to see ---------- */
  function buyerState(store, buyer) {
    var now = store.now(), s = activeSale(store);
    var out = { ok: true, role: 'buyer', name: buyer.name, ver: store.ver(), now: now, sale: saleView(s, now), lots: [] };
    if (!out.sale.open) return out;
    var grouped = groupBids(store.read('Bids'), s.id);
    store.read('Lots').filter(function (l) { return l.saleId === s.id; })
      .sort(function (a, b) { return a.sort - b.sort; })
      .forEach(function (l) {
        var list = grouped[l.id] || [], st = stats(list);
        var mine = find(list, function (b) { return b.buyerId === buyer.id; });
        var sold = l.status === 'sold';
        out.lots.push({
          id: l.id, lotNo: l.lotNo, grade: l.grade, bags: l.bags, perBag: l.perBag, qty: l.bags * l.perBag,
          startPrice: l.startPrice, status: l.status,
          high: sold ? l.soldPrice : (st.best ? st.best.amount : 0),
          my: mine ? mine.amount : 0,
          lead: !sold && l.status === 'open' && !!st.best && st.best.buyerId === buyer.id,
          won: sold && l.soldTo === buyer.id
        });
      });
    return out;
  }

  function adminState(store, extra) {
    var now = store.now(), s = activeSale(store);
    var lots = store.read('Lots').filter(function (l) { return l.saleId === s.id; }).sort(function (a, b) { return a.sort - b.sort; });
    var allBuyers = store.read('Buyers'), buyers = allBuyers.filter(function (b) { return b.saleId === s.id; });
    var bids = store.read('Bids').filter(function (b) { return b.saleId === s.id; });
    var out = {
      ok: true, role: 'admin', name: 'Admin', ver: store.ver(), now: now,
      sale: saleView(s, now),
      lots: lots.map(function (l) { return { id: l.id, lotNo: l.lotNo, grade: l.grade, bags: l.bags, perBag: l.perBag, qty: l.bags * l.perBag, startPrice: l.startPrice, targetPrice: l.targetPrice, remarks: l.remarks, status: l.status, soldTo: l.soldTo, soldPrice: l.soldPrice }; }),
      buyers: buyers.map(function (b) { return { id: b.id, name: b.name, code: b.code }; }),
      bids: bids.map(function (b) { return { lotId: b.lotId, buyerId: b.buyerId, amount: b.amount, ts: b.ts }; }),
      sales: store.read('Sales').map(function (x) { return { id: x.id, company: x.company, saleNo: x.saleNo, date: x.date, buyers: allBuyers.filter(function (b) { return b.saleId === x.id; }).length }; }),
      companies: JSON.parse(getSet(store, 'companies') || '[]')

    if (extra) for (var k in extra) out[k] = extra[k];

  }

  /* ---------- buyer places or changes a bid ---------- */
  function bidReq(store, req) {
    var a = auth(store, req.code);
    if (a.role !== 'buyer') throw fail('bad_code');
    return store.lock(function () {
      var now = store.now(), sales = store.read('Sales'), sid = getSet(store, 'activeSale');
      var sale = find(sales, function (x) { return x.id === sid; });
      if (!sale || !isOpen(sale, now)) throw fail('closed');
      var lot = find(store.read('Lots'), function (l) { return l.id === req.lotId && l.saleId === sid; });
      if (!lot) throw fail('nolot');
      if (lot.status === 'sold') throw fail('lot_sold');
      if (lot.status === 'na') throw fail('lot_na');
      var amount = round2(num(req.amount));
      if (!(amount > 0)) throw fail('bad_amount');
      if (lot.startPrice > 0 && amount < lot.startPrice) throw fail('below_start', { min: lot.startPrice });

      var bids = store.read('Bids');
      var lotBids = bids.filter(function (b) { return b.saleId === sid && b.lotId === lot.id; });
      var st = stats(lotBids), high = st.best ? st.best.amount : 0;
      var cap = Math.max(high, lot.startPrice, 0) * 10;
      if (cap === 0) cap = 100000;
      if (amount > cap) throw fail('too_high');

      var mine = find(bids, function (b) { return b.saleId === sid && b.lotId === lot.id && b.buyerId === a.buyer.id; });
      if (mine) { if (mine.amount !== amount) { mine.amount = amount; mine.ts = now; } }
      else bids.push({ saleId: sid, lotId: lot.id, buyerId: a.buyer.id, amount: amount, ts: now });
      store.write('Bids', bids);

      var extended = 0;
      if (sale.mode === 'scheduled' && sale.extendMin > 0 && sale.end > 0 && sale.end - now <= sale.extendMin * 60000) {
        sale.end = now + sale.extendMin * 60000; extended = sale.extendMin;
        store.write('Sales', sales);
      }
      commit(store, a.buyer.name, 'bid', 'Lot ' + lot.lotNo + ' = ' + amount);
      var out = buyerState(store, a.buyer);
      out.placed = { lotId: lot.id, amount: amount, lotNo: lot.lotNo };
      out.extended = extended;

    });
  }

  /* ---------- admin actions ---------- */
  function newCode(store, taken) {
    for (var i = 0; i < 200; i++) {
      var c = String(100000 + Math.floor(store.rand() * 900000));
      if (!taken[c]) { taken[c] = 1; return c; }

  }
  function takenCodes(store) {
    var t = {}; t[String(getSet(store, 'adminCode'))] = 1;
    store.read('Buyers').forEach(function (b) { t[b.code] = 1; });
    return t;
  }
  function copyBuyers(store, fromId, toId, now) {
    var bs = store.read('Buyers'), have = {}, n = 0;
    bs.forEach(function (b) { if (b.saleId === toId) have[String(b.name).toLowerCase()] = 1; });
    bs.filter(function (b) { return b.saleId === fromId; }).forEach(function (b) {
      if (have[String(b.name).toLowerCase()]) return;
      n++; bs.push({ id: uid(store, 'B') + n, saleId: toId, code: b.code, name: b.name, created: now });
    });
    store.write('Buyers', bs);
    return n;
  }
  function sellLot(store, lot, buyerId, price) {
    lot.status = 'sold';
    if (buyerId === undefined || buyerId === null) {
      var st = stats(store.read('Bids').filter(function (b) { return b.saleId === lot.saleId && b.lotId === lot.id; }));
      lot.soldTo = st.best ? st.best.buyerId : '';
      lot.soldPrice = st.best ? st.best.amount : 0;
    } else { lot.soldTo = buyerId; lot.soldPrice = round2(num(price)); }
  }

  function adminReq(store, req) {
    var a = auth(store, req.code);
    if (a.role !== 'admin') throw fail('bad_code');
    var act = req.action;
    if (act === 'a_state') return adminState(store);

    return store.lock(function () {
      var sid = getSet(store, 'activeSale'), now = store.now();

      if (act === 'a_setBid') {
        var buyer = find(store.read('Buyers'), function (b) { return b.id === req.buyerId && b.saleId === sid; });
        var lot = find(store.read('Lots'), function (l) { return l.id === req.lotId && l.saleId === sid; });
        if (!buyer || !lot) throw fail('nolot');
        var amount = round2(num(req.amount)), bids = store.read('Bids');
        var idx = -1;
        for (var i = 0; i < bids.length; i++) if (bids[i].saleId === sid && bids[i].lotId === lot.id && bids[i].buyerId === buyer.id) idx = i;
        if (amount <= 0) { if (idx >= 0) bids.splice(idx, 1); }
        else if (idx >= 0) { if (bids[idx].amount !== amount) { bids[idx].amount = amount; bids[idx].ts = now; } }
        else bids.push({ saleId: sid, lotId: lot.id, buyerId: buyer.id, amount: amount, ts: now });
        store.write('Bids', bids);
        commit(store, 'Admin', 'setBid', buyer.name + ' Lot ' + lot.lotNo + ' = ' + amount);
        return adminState(store);
      }

      if (act === 'a_saveLot') {
        var p = req.lot || {}, lots = store.read('Lots'), l;
        if (p.id) { l = find(lots, function (x) { return x.id === p.id && x.saleId === sid; }); if (!l) throw fail('nolot'); }
        else {
          var maxSort = 0; lots.forEach(function (x) { if (x.saleId === sid && x.sort > maxSort) maxSort = x.sort; });
          l = { id: uid(store, 'L'), saleId: sid, lotNo: '', grade: '', bags: 0, perBag: 0, startPrice: 0, targetPrice: 0, remarks: '', status: 'open', soldTo: '', soldPrice: 0, sort: maxSort + 1 };
          lots.push(l);
        }
        ['lotNo', 'grade', 'remarks'].forEach(function (k) { if (p[k] !== undefined) l[k] = clean(p[k], 100); });
        ['bags', 'perBag', 'startPrice', 'targetPrice'].forEach(function (k) { if (p[k] !== undefined) l[k] = Math.max(0, round2(num(p[k]))); });
        if (p.status !== undefined && p.status !== l.status) {
          if (['open', 'sold', 'na'].indexOf(p.status) < 0) throw fail('bad_status');
          if (p.status === 'sold') sellLot(store, l); else { l.status = p.status; l.soldTo = ''; l.soldPrice = 0; }
        }

        commit(store, 'Admin', 'saveLot', 'Lot ' + l.lotNo);
        return adminState(store);
      }

      if (act === 'a_saveLots') {
        var list = Array.isArray(req.lots) ? req.lots.slice(0, 300) : [], lotsB = store.read('Lots'), maxS = 0;
        lotsB.forEach(function (x) { if (x.saleId === sid && x.sort > maxS) maxS = x.sort; });
        list.forEach(function (p) {
          var l;
          if (p.id) { l = find(lotsB, function (x) { return x.id === p.id && x.saleId === sid; }); if (!l) return; }
          else {
            if (!clean(p.lotNo, 100)) return;
            maxS += 1;
            l = { id: uid(store, 'L'), saleId: sid, lotNo: '', grade: '', bags: 0, perBag: 0, startPrice: 0, targetPrice: 0, remarks: '', status: 'open', soldTo: '', soldPrice: 0, sort: maxS };
            lotsB.push(l);
          }
          ['lotNo', 'grade', 'remarks'].forEach(function (k) { if (p[k] !== undefined) l[k] = clean(p[k], 100); });
          ['bags', 'perBag', 'startPrice', 'targetPrice'].forEach(function (k) { if (p[k] !== undefined) l[k] = Math.max(0, round2(num(p[k]))); });
          if (p.status !== undefined && p.status !== l.status && ['open', 'sold', 'na'].indexOf(p.status) >= 0) {
            if (p.status === 'sold') sellLot(store, l); else { l.status = p.status; l.soldTo = ''; l.soldPrice = 0; }

        store.write('Lots', keep);
        store.write('Bids', store.read('Bids').filter(function (b) { return b.lotId !== req.lotId; }));
        commit(store, 'Admin', 'deleteLot', req.lotId);
        return adminState(store);
      }

      if (act === 'a_importLots') {
        var rows = req.rows || [], all = store.read('Lots');
        if (req.replace) {
          var gone = {}; all.forEach(function (x) { if (x.saleId === sid) gone[x.id] = 1; });
          all = all.filter(function (x) { return x.saleId !== sid; });
          store.write('Bids', store.read('Bids').filter(function (b) { return !gone[b.lotId]; }));
        }
        var m = 0; all.forEach(function (x) { if (x.saleId === sid && x.sort > m) m = x.sort; });
        rows.slice(0, 500).forEach(function (r) {
          if (!clean(r.lotNo)) return;
          m++;
          all.push({ id: uid(store, 'L') + m, saleId: sid, lotNo: clean(r.lotNo), grade: clean(r.grade), bags: Math.max(0, num(r.bags)), perBag: Math.max(0, num(r.perBag)), startPrice: Math.max(0, num(r.startPrice)), targetPrice: Math.max(0, num(r.targetPrice)), remarks: clean(r.remarks), status: 'open', soldTo: '', soldPrice: 0, sort: m });
        });
        store.write('Lots', all);
        commit(store, 'Admin', 'importLots', rows.length + ' rows');
        return adminState(store);
      }

      if (act === 'a_saveSale') {
        var sales = store.read('Sales'), s = find(sales, function (x) { return x.id === sid; }), q = req.sale || {};

        if (q.note !== undefined) s.note = clean(q.note, 300);
        if (q.mode !== undefined) {

        return adminState(store);
      }

      if (act === 'a_switchSale') {
        if (!find(store.read('Sales'), function (x) { return x.id === req.saleId; })) throw fail('no_sale');
        setSet(store, 'activeSale', req.saleId);
        commit(store, 'Admin', 'switchSale', req.saleId);
        return adminState(store);
      }

      if (act === 'a_addBuyers') {
        var names = (req.names || []).map(function (x) { return clean(x, 80); }).filter(Boolean).slice(0, 200);
        var bs = store.read('Buyers'), taken = takenCodes(store), made = [];
        names.forEach(function (nm) {
          var b = { id: uid(store, 'B'), saleId: sid, code: newCode(store, taken), name: nm, created: now };
          bs.push(b); made.push({ name: nm, code: b.code });
        });
        store.write('Buyers', bs);
        commit(store, 'Admin', 'addBuyers', String(made.length));
        return adminState(store, { created: made });

      if (act === 'a_deleteBuyer') {
        store.write('Buyers', store.read('Buyers').filter(function (b) { return b.id !== req.buyerId; }));

        return adminState(store);
      }

      if (act === 'a_newCode') {
        var bs2 = store.read('Buyers'), bb = find(bs2, function (b) { return b.id === req.buyerId; });
        if (!bb) throw fail('nobuyer');
        bb.code = newCode(store, takenCodes(store));
        store.write('Buyers', bs2);
        commit(store, 'Admin', 'newCode', bb.name);
        return adminState(store);

        if (!req.fromSale || req.fromSale === sid) throw fail('no_sale');

      if (act === 'a_newCodeAll') {
        var bsA = store.read('Buyers'), tk = takenCodes(store), outA = [];
        bsA.forEach(function (b) { if (b.saleId === sid) { b.code = newCode(store, tk); outA.push({ name: b.name, code: b.code }); } });
        store.write('Buyers', bsA);
        commit(store, 'Admin', 'newCodeAll', String(outA.length));
        return adminState(store, { created: outA });
      }

      if (act === 'a_clearBids') {
        store.write('Bids', store.read('Bids').filter(function (b) { return b.saleId !== sid; }));
        var lots4 = store.read('Lots');
        lots4.forEach(function (x) { if (x.saleId === sid && x.status === 'sold') { x.status = 'open'; x.soldTo = ''; x.soldPrice = 0; } });
        store.write('Lots', lots4);
        commit(store, 'Admin', 'clearBids', sid);
        return adminState(store);
      }

      if (act === 'a_setCompanies') {
        var list = (req.companies || []).map(function (x) { return clean(x, 120); }).filter(Boolean).slice(0, 10);
        if (!list.length) throw fail('bad_companies');
        setSet(store, 'companies', JSON.stringify(list));
        commit(store, 'Admin', 'setCompanies', list.join('|'));
        return adminState(store);
      }

      if (act === 'a_setAdminCode') {
        var nc = norm(req.newCode);
        if (nc.length < 6) throw fail('short_code');
        if (takenCodes(store)[nc] && nc !== String(getSet(store, 'adminCode'))) throw fail('code_used');
        setSet(store, 'adminCode', nc);
        commit(store, 'Admin', 'setAdminCode', '');
        return adminState(store);
      }

      throw fail('bad_action');
    });
  }

  /* ---------- entry point ---------- */
  function handle(store, req) {
    try {
      req = req || {};
      init(store);
      var a = String(req.action || '');
      if (a === 'state') {
        if (req.v && req.v === store.ver() && req.role) return { ok: true, unchanged: true, now: store.now() };
        var au = auth(store, req.code);
        return au.role === 'admin' ? adminState(store) : buyerState(store, au.buyer);
      }
      if (a === 'bid') return bidReq(store, req);
      if (a.indexOf('a_') === 0) return adminReq(store, req);
      throw fail('bad_action');
    } catch (e) {
      if (e && e.code) return errRes(e);
      throw e;
    }
  }

  return { handle: handle, init: init, seedDemo: seedDemo, SCHEMA: SCHEMA, NUMCOLS: NUMCOLS };
})();

/* ===== DEMO STORAGE (only used when the page is not yet connected to Google) ===== */
function makeLocalStore() {
  var mem = {}, ok = true, P = 'theaDemo_';
  try { localStorage.setItem(P + 't', '1'); localStorage.removeItem(P + 't'); } catch (e) { ok = false; }
  function get(k) { try { var v = ok ? localStorage.getItem(P + k) : mem[k]; return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function put(k, v) { var s = JSON.stringify(v); try { if (ok) localStorage.setItem(P + k, s); else mem[k] = s; } catch (e) { mem[k] = s; } }
  return {
    read: function (n) { return get(n) || []; },
    write: function (n, rows) { put(n, rows); },
    append: function (n, row) { var r = get(n) || []; r.push(row); if (r.length > 300) r = r.slice(-300); put(n, r); },
    lock: function (fn) { return fn(); },
    now: function () { return Date.now(); },
    rand: function () { return Math.random(); },
    sleep: function () {},
    ver: function () { return String(get('ver') || 1); },
    bump: function () { put('ver', Date.now() + Math.random()); },
    failCount: function () { return 1; },
    reset: function () { ['Settings','Sales','Lots','Buyers','Bids','Log','ver'].forEach(function (k) { try { if (ok) localStorage.removeItem(P + k); } catch (e) {} delete mem[k]; }); }
  };
}

}
function closeModal() { M = null; var el = $('#modal'); el.classList.remove('on'); el.innerHTML = ''; }
function curLot() { return S && S.lots ? S.lots.filter(function (x) { return x.id === M.id; })[0] : null; }

$('#modal').addEventListener('click', function (e) {

var reportOpen = false;
function buildReport() {
  var tgCount = 0, tgMet = 0;
  var s = S.sale, n = nowMs(), totalKg = 0, withBid = 0, noBid = [], sold = 0, na = 0, val = 0, kgIn = 0, lines = [], active = {};
  S.bids.forEach(function (b) { if (b.amount > 0) active[b.buyerId] = 1; });
  S.lots.forEach(function (l) {

    var tg = l.targetPrice > 0 ? l.targetPrice : 0, tgTxt = function (price) { if (!tg) return ''; tgCount++; if (price >= tg) { tgMet++; return ' | target ₹' + inr(tg) + ' ✔'; } return ' | target ₹' + inr(tg) + ' (₹' + inr(round2(tg - price)) + ' short)'; };
    if (l.status === 'na') { na++; lines.push('⚪ ' + lab + ' – not available'); }
    else if (l.status === 'sold') { sold++; val += l.qty * l.soldPrice; kgIn += l.qty; lines.push('🔵 ' + lab + ' – SOLD ₹' + inr(l.soldPrice) + ' to ' + (buyerName(l.soldTo) || 'outside buyer') + tgTxt(l.soldPrice)); }

    else { noBid.push(l.lotNo); lines.push('🔴 ' + lab + ' – NO BID' + (tg ? ' | target ₹' + inr(tg) : '')); }

  var status = s.open ? 'OPEN' + (s.end > 0 ? ' – closes ' + fmtWhen(s.end) + ' (' + fmtCount(s.end - n).slice(0, 5) + ' hrs left)' : '') : (s.mode === 'scheduled' && s.start > n ? 'NOT STARTED – opens ' + fmtWhen(s.start) : 'CLOSED');
  var out = ['*' + s.company + (s.saleNo ? ' – ' + s.saleNo : '') + '*', '📊 *SALE POSITION* as on ' + new Date(n).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }),
    'Auction: *' + status + '*', '',

  if (noBid.length) out.push('', '⚠ *Need attention (no bid):* ' + noBid.join(', '));
  return out.join('\n');
}

    cfm(liveSteps('You are changing the <b>sale details / timing</b>.'), function () { adminCall({ action: 'a_saveSale', sale: sv }, 'Settings saved'); });
  }
  else if (act === 'savecompanies') adminCall({ action: 'a_setCompanies', companies: val('fCompanies').split(/\r?\n/) }, 'Company names saved');
  else if (act === 'newsale') {
    if (!val('nSaleNo').trim()) { adminMsg = 'Please type the new sale number.'; return render(); }
    adminCall({ action: 'a_newSale', company: val('nCompany'), saleNo: val('nSaleNo'), date: val('nDate'), copyFrom: val('nCopy'), copyBuyersFrom: val('nCopyB') }, 'New sale created – now check the buyers in tab 3');
    tab = 'buyers';
  }
  else if (act === 'switchsale') adminCall({ action: 'a_switchSale', saleId: val('swSale') }, 'Sale changed');
  else if (act === 'clearbids') { cfm([{ title: 'Delete ALL bids?', body: 'Every bid of this sale is deleted. This cannot be undone.', ok: 'Yes, continue' }, { title: 'Are you really sure?', body: 'All bids will be gone.', ok: 'Yes, delete all bids' }], function () { adminCall({ action: 'a_clearBids' }, 'All bids cleared'); }); }
  else if (act === 'setadmin') {
    var nv = val('newAdmin').replace(/\D/g, '');
    if (nv.length < 6 || nv.length > 10) { adminMsg = 'The admin secret code must be 6 to 10 digits.'; return render(); }
    cfm([{ title: 'Change the admin secret code?', body: 'The new code will be <b style="font-size:24px;letter-spacing:3px">' + nv + '</b><br>Write it down now. The OLD code will stop working at once for everybody.', ok: 'Yes, continue' },
      { title: 'Are you really sure?', body: 'Anyone who has the old code will be locked out. Only you (and whoever you tell) can enter with <b>' + nv + '</b>.', ok: 'Yes, change it' }],
      function () { adminCall({ action: 'a_setAdminCode', newCode: nv }, 'Admin secret code changed').then(function (r) { if (r && r.ok) { code = nv; store('thea_code', nv); } }); });
  }
  else if (act === 'csv') {
    var q = function (v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; };
    var lines = [['Lot', 'Grade', 'Bags', 'Kg/bag', 'Total kg', 'Status', 'Target', 'Highest', 'Leader'].concat(S.buyers.map(function (x) { return x.name; })).map(q).join(',')];
    S.lots.forEach(function (l) {
      var ld = leaderOf(l.id);
      lines.push([l.lotNo, l.grade, l.bags, l.perBag, l.qty, l.status === 'sold' ? 'SOLD to ' + buyerName(l.soldTo) + ' @ ' + l.soldPrice : l.status, l.targetPrice || '', ld ? ld.amount : '', ld ? buyerName(ld.buyerId) : ''].concat(S.buyers.map(function (x) {
        var bd = S.bids.filter(function (y) { return y.lotId === l.id && y.buyerId === x.id; })[0]; return bd ? bd.amount : '';
      })).map(q).join(','));
    });
    var blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' }), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'auction-results-' + (S.sale.saleNo || 'sale').replace(/\W+/g, '-') + '.csv'; document.body.appendChild(a); a.click(); a.remove();
  }
});

/* ---------- start ---------- */
(function () {
  var saved = store('thea_code');
  if (saved) {
    $('#app').innerHTML = '<p style="text-align:center;margin-top:60px">…</p>';
    api({ action: 'state', code: saved }).then(function (res) {
      if (res.ok) { code = saved; apply(res); render(); startPolling(); } else showLogin();
    });
  } else showLogin();
})();
</script>
</body>
</html>
